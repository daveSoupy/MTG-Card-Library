# Builds, signs and publishes the desktop app (Phase 34).
#
#   tag v1.2.3   -> one GitHub Release "v1.2.3" carrying
#                     MTG-Library-1.2.3-mac-arm64.dmg      what a Mac user downloads
#                     MTG-Library-1.2.3-mac-arm64.zip      what an installed Mac app's updater fetches
#                     MTG-Library-1.2.3-win-x64-setup.exe  the Windows installer
#                     latest-mac.yml, latest.yml           electron-updater's pointers to the above
#                     *.blockmap                           differential-download indexes
#                     SHA256SUMS
#
# The same tag triggers docker.yml, so one `git tag` produces the image and
# both installers. docker.yml is not touched by this file and knows nothing
# about it.
#
# The release is created as a draft first and published only after the Mac
# build has passed its gates and uploaded, so an installed app that checks
# for updates never sees a release with half its files. The Windows job is
# optional in both senses: it runs only when switched on, and if it fails the
# release still goes out with the Mac files — a broken Windows build must
# never hold the Mac one back. If the Mac job fails the draft stays a draft;
# fix and re-run, and the re-run uploads over it.
#
# The tag must equal desktop/package.json's version: that version is what the
# running app compares against latest*.yml, so a tag that does not match it
# would ship an app that thinks it is something else. The first job checks
# and fails fast with the command to fix it.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#
#   macOS — all five required, or the Mac job fails (a Mac build that is not
#   notarised is one nobody else can open, so there is no unsigned fallback):
#     CSC_LINK                    the Developer ID Application certificate as a
#                                 .p12 exported from Keychain Access, base64:
#                                   base64 -i DeveloperID.p12 | pbcopy
#                                 (the names are electron-builder's, but the
#                                 import is done by a step below — see it)
#     CSC_KEY_PASSWORD            the password given when exporting the .p12
#     APPLE_ID                    the Apple ID email of the developer account
#     APPLE_APP_SPECIFIC_PASSWORD an app-specific password made at
#                                 appleid.apple.com -> Sign-In and Security ->
#                                 App-Specific Passwords. Never the real one.
#     APPLE_TEAM_ID               the ten-character Team ID (developer.apple.com
#                                 -> Membership details)
#
#   Windows — the job only runs when the repository *variable* BUILD_WINDOWS
#   is "true" (Settings -> Secrets and variables -> Actions -> Variables),
#   and its failure never blocks the release. Then the optional pair: with
#   both set the installer is signed;
#   with neither, it is built unsigned and the job says so. A signed installer from
#   a new certificate still shows SmartScreen until the certificate accrues
#   reputation; an EV certificate skips it.
#     WIN_CSC_LINK                the code-signing certificate as a .pfx, base64
#     WIN_CSC_KEY_PASSWORD        its password
#
#   GITHUB_TOKEN is provided by Actions and needs only `contents: write`.
#   The repository is public, so installed apps need no token to read the
#   release.

name: Desktop app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  # ------------------------------------------------------------------------
  # The version must match the tag, and the release exists (as a draft)
  # before either build starts uploading.
  # ------------------------------------------------------------------------
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches desktop/package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./desktop/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag but desktop/package.json is $version. Run: npm version $tag --workspace=desktop --no-git-tag-version, commit, and re-tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; uploading over it"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "MTG Library $GITHUB_REF_NAME" \
              --notes "Desktop app for macOS (Apple silicon) and Windows. Installed apps update to this release on their own. The Docker image is ghcr.io/davesoupy/mtg-card-library:${GITHUB_REF_NAME#v}."
          fi

  # ------------------------------------------------------------------------
  # macOS: arm64, signed with the Developer ID, hardened runtime, notarised
  # and stapled by electron-builder; then the gate proves all of it.
  # ------------------------------------------------------------------------
  mac:
    needs: release
    runs-on: macos-latest # Apple silicon since macos-14; the build is arm64-only
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Mac secrets are all present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing — see the comment at the top of .github/workflows/desktop.yml"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # The certificate goes into a temporary keychain here, not through
      # electron-builder's CSC_LINK: its importer hands the .p12 password to
      # `security set-key-partition-list -k`, which wants the *keychain*
      # password, so it only works when the two happen to match. This is the
      # same sequence apple-actions/import-codesign-certs runs. The keychain
      # is passed on as CSC_KEYCHAIN and dies with the runner.
      - name: Import the Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Identities in the keychain:"
          security find-identity -v -p codesigning "$keychain"

      # fetch → stage → tsc → check-sqlite on the staged tree → electron-builder
      # (sign, notarise, staple, dmg + zip) → check-packaged. The two
      # --require flags make an unsigned or un-notarised result a failure.
      - name: Package, sign, notarise
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package --workspace=desktop -- --mac --require-signed --require-notarized

      - name: Runs under the hardened runtime
        timeout-minutes: 8
        # The packaged app, launched for real: the server comes up on the
        # bundled Node, answers /api/v1/health, and the lifecycle checks pass.
        # A JIT crash would show here, not on a user's Mac. --skip-mdns: the
        # runner's network carries no multicast, so dns-sd can never see it.
        run: node desktop/scripts/verify-lifecycle.mjs --app "$GITHUB_WORKSPACE/desktop/out/mac-arm64/MTG Library.app/Contents/MacOS/MTG Library" --skip-mdns

      - name: What was built
        run: ls -la desktop/out/*.dmg desktop/out/*.zip desktop/out/*.blockmap desktop/out/latest-mac.yml

      - uses: actions/upload-artifact@v5
        with:
          name: mac
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.blockmap
            desktop/out/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  # Windows: x64 NSIS installer, signed if a certificate is configured.
  # ------------------------------------------------------------------------
  windows:
    needs: release
    if: vars.BUILD_WINDOWS == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Signed or unsigned?
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "::notice::Windows installer will be SIGNED with the certificate in WIN_CSC_LINK"
          else
            echo "::notice::Windows installer will be UNSIGNED — no WIN_CSC_LINK secret. SmartScreen will show 'Windows protected your PC'; More info -> Run anyway."
          fi

      - run: npm ci
      - run: npm run build

      # fetch → stage → tsc → check-sqlite on the staged tree (the bundled
      # Windows Node runs here, so the gate is real on this runner) →
      # electron-builder → check-packaged.
      - name: Package
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package --workspace=desktop -- --win

      - name: What was built
        shell: bash
        run: ls -la desktop/out/*.exe desktop/out/*.blockmap desktop/out/latest.yml

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            desktop/out/*.exe
            desktop/out/*.blockmap
            desktop/out/latest.yml
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  # Mac passed: one SHA256SUMS over whatever was built, upload, publish.
  # ------------------------------------------------------------------------
  publish:
    needs: [release, mac, windows]
    # The Mac build is the release; Windows is added when it succeeded and
    # left out (with a warning) when it was off or failed.
    if: ${{ !cancelled() && needs.mac.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true

      - name: Windows outcome
        run: |
          case "${{ needs.windows.result }}" in
            success) echo "Windows installer included" ;;
            skipped) echo "::notice::Windows build is off (repository variable BUILD_WINDOWS is not 'true'); Mac-only release" ;;
            *)       echo "::warning::Windows build ${{ needs.windows.result }}; publishing the Mac release without it. Fix the Windows job and re-run this workflow to add the installer to the same release." ;;
          esac

      - name: SHA256SUMS
        working-directory: release
        run: |
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
