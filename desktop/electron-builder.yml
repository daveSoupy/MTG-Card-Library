# electron-builder configuration for the desktop app (Phase 32).
#
# What gets packaged, and where it lands inside the app:
#
#   app.asar                      the shell: dist/main.js (+ config, logging,
#                                 server), assets/ (tray icons), package.json.
#                                 asar stays ON for these — they are the only
#                                 thing in it.
#   Resources/mtg-library/        the staged server tree (scripts/stage.mjs):
#                                 schema.sql, server/dist, web/dist, a
#                                 production node_modules. Shipped as
#                                 extraResources, which is never put in an
#                                 asar — better-sqlite3's .node binary and the
#                                 sync worker (`new Worker(path)`) cannot load
#                                 from inside one. Named "mtg-library", not
#                                 "app": Electron treats Resources/app as the
#                                 application itself if that directory exists.
#   Resources/node/node(.exe)     the bundled official Node (scripts/fetch-node.mjs)
#                                 the server runs on. Never Electron's Node.
#
# `files` is the shell only; it never points at the workspace. Rebuilding
# native modules is off: the staged tree already holds the prebuilt
# better-sqlite3 for the bundled Node's ABI, and a rebuild is exactly what
# could lose FTS5.
#
# node_modules is a separate extraResources entry on purpose: electron-builder's
# copy filter (app-builder-lib/out/util/filter.js) drops a directory named
# node_modules at the root of any source, unconditionally, so the staged tree's
# node_modules is copied from its own root. check-packaged.mjs is what caught
# this.
#
# Signing and updates (Phase 34):
#
#   macOS    Developer ID Application, found in the login keychain locally or
#            imported from CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD on CI.
#            Hardened runtime with the entitlements in build/ — the inherit
#            file is what the bundled Node and better_sqlite3.node are signed
#            with, and both need allow-jit. @electron/osx-sign walks all of
#            Contents/ and signs every Mach-O it finds, Resources/ included;
#            `binaries` lists the bare `node` executable anyway so the intent
#            is explicit and survives a walker change. `notarize: true` reads
#            APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the
#            environment and staples the ticket; with none of them set the
#            build is signed but not notarised (a logged skip, not a failure).
#            No identity in the keychain at all → unsigned, as before.
#   Windows  signed when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD are set, unsigned
#            when not; nothing here decides, the environment does.
#   publish  where electron-updater looks (Resources/app-update.yml is written
#            from this) and what makes electron-builder write latest-mac.yml /
#            latest.yml into out/. Uploading is the workflow's job with `gh`
#            (`--publish never` here); the yml files are generated regardless.
#
# electron-builder 26's option layout: hardenedRuntime, entitlements,
# entitlementsInherit, binaries and identity are flat keys under `mac`. The
# phase doc describes a `mac.sign` object from a v27 that had not shipped at
# build time; `mac.sign` in 26 is a custom sign *function* — do not move them.
#
# Artifact names carry no spaces. GitHub rewrites a space in an asset name to
# a dot and electron-updater to a hyphen; a name with neither is fetched as
# written.

appId: com.davesoupy.mtglibrary
productName: MTG Library
copyright: MIT licence — see LICENSE

directories:
  output: out
  buildResources: build

files:
  - dist/**/*
  - "!dist/**/*.map"
  - assets/**/*
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
# Strips extended attributes on macOS before signing; codesign refuses a file
# carrying them, and Electron's extracted zip carries thousands.
afterPack: scripts/after-pack.mjs

publish:
  provider: github
  owner: daveSoupy
  repo: MTG-Card-Library

mac:
  target:
    # The .dmg is what a person downloads; the .zip is what an installed app's
    # updater fetches (latest-mac.yml cannot be generated without one).
    #
    # Two arches. Electron 44 needs macOS 13, which every Intel Mac from 2017
    # on can run, and an arm64-only build gave those machines no artifact at
    # all. Universal binaries are the alternative and were not taken: they
    # would double the download for everyone to serve the smaller half.
    #
    # electron-builder writes ONE latest-mac.yml listing both zips —
    # writeUpdateInfoFiles merges tasks that share a channel file — and
    # electron-updater picks between them by looking for the string "arm64"
    # in the file name (MacUpdater.filterFilesForArch: an Apple silicon Mac
    # prefers a file that has it, an Intel Mac excludes every file that does).
    # So the arch has to stay in the artifact name, and the x64 name must not
    # contain the word "arm64" anywhere.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # ${arch} survives for *both* arches only because this pattern is set here.
  # electron-builder strips the "-${arch}" fragment for the default arch (x64)
  # — unless the pattern came from the config, which expandArtifactNamePattern
  # calls isUserForced. It did, so arm64 keeps exactly the name it has always
  # had and Intel gets "-mac-x64" rather than a bare "-mac".
  artifactName: MTG-Library-${version}-mac-${arch}.${ext}
  category: public.app-category.utilities
  darkModeSupport: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Relative to the .app. The walk would find it; this says so.
  binaries:
    - Contents/Resources/node/node
  # Only Mach-O files may be signed. @electron/osx-sign signs every file whose
  # *content* looks binary — the web client's PNG icons, a .jpg and a .zip in
  # some package's test fixtures — and codesign stores a non-Mach-O file's
  # signature in an extended attribute, which the outer bundle then refuses
  # when sealing Resources/ ("resource fork, Finder information, or similar
  # detritus not allowed"). Electron's own .pak files are inside a nested
  # framework bundle, so stock Electron apps never see this; our extra
  # resources are sealed by the app itself. The one Mach-O in the staged tree
  # is better_sqlite3.node, which must be signed, so the ignore spares .node.
  signIgnore:
    - /Resources/mtg-library/.*(?<!\.node)$
  notarize: true
  # spctl only accepts a notarised app; the workflow runs it after notarisation.
  gatekeeperAssess: false
  # ${arch} again: FileMatcher runs every `from`/`to` through the same macro
  # expander, so one block serves both arches and there is no second place to
  # forget to update. scripts/stage.mjs and scripts/fetch-node.mjs produce the
  # matching directory per target.
  extraResources:
    - from: staging/darwin-${arch}
      to: mtg-library
    - from: staging/darwin-${arch}/node_modules
      to: mtg-library/node_modules
    - from: vendor/node/darwin-${arch}/node
      to: node/node
    - from: vendor/node/darwin-${arch}/LICENSE
      to: node/LICENSE

win:
  target:
    - target: nsis
      arch: [x64]
  # Signed iff WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD are in the environment;
  # unsigned otherwise (SmartScreen: More info → Run anyway). The workflow
  # says which it did.
  extraResources:
    - from: staging/win32-x64
      to: mtg-library
    - from: staging/win32-x64/node_modules
      to: mtg-library/node_modules
    - from: vendor/node/win32-x64/node.exe
      to: node/node.exe
    - from: vendor/node/win32-x64/LICENSE
      to: node/LICENSE

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  artifactName: MTG-Library-${version}-win-x64-setup.${ext}

# Never: systemd and Docker cover Linux.
linux:
  target: []
