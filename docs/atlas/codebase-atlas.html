conds after an undoable action.","imports":["web/src/undo.ts"],"test":true},{"id":"web/src/components/WantListsPage.tsx","side":"web","layer":"pages","group":"pages","lines":560,"blurb":"Want lists with drag reorder, target prices, and substitutes for a want.","imports":["web/src/api.ts","web/src/components/SubstitutesSheet.tsx","web/src/substitutes.ts","web/src/components/CardPicker.tsx","web/src/components/CardDetailPane.tsx","web/src/components/CustomizeView.tsx","web/src/components/BackToTop.tsx","web/src/components/UndoToast.tsx","web/src/undo.ts","web/src/density.ts","web/src/viewport.ts"],"test":true},{"id":"web/src/components/WhatIfDialog.tsx","side":"web","layer":"deckbuilder","group":"deck builder","lines":76,"blurb":"\"What would breaking this up free?\"  A simulation, not a change: the server runs Phase 24's engine with this deck's status overridden to disassembled and reports the difference.","imports":["web/src/api.ts","web/src/contention.ts"],"test":false},{"id":"web/src/contention.ts","side":"web","layer":"helpers","group":"helpers","lines":124,"blurb":"How contention reads.  Every number here arrives from the server's `decks/contention.ts`, which read it from `buildability.ts` and `allocation.ts`.","imports":["web/src/api.ts","web/src/buildability.ts"],"test":true},{"id":"web/src/deckHistory.ts","side":"web","layer":"helpers","group":"helpers","lines":174,"blurb":"Undo/redo for the deck builder.  Decks autosave server-side, so a history cannot be a stack of client state: the truth lives in the database.","imports":["web/src/api.ts"],"test":true},{"id":"web/src/deckSlot.ts","side":"web","layer":"helpers","group":"helpers","lines":100,"blurb":"What a deck slot needs you to do about it.","imports":["web/src/api.ts"],"test":true},{"id":"web/src/deckView.ts","side":"web","layer":"helpers","group":"helpers","lines":433,"blurb":"Ordering and grouping for card lists.  This is presentation rather than a rule \u2014 a phone might reasonably group differently from a desktop \u2014 so it lives in the client.","imports":["web/src/api.ts"],"test":true},{"id":"web/src/density.ts","side":"web","layer":"helpers","group":"helpers","lines":129,"blurb":"Display density \u2014 how much of a card a tile shows.","imports":[],"test":true},{"id":"web/src/format.ts","side":"web","layer":"helpers","group":"helpers","lines":16,"blurb":"formatBytes and a zero-safe percent.","imports":[],"test":true},{"id":"web/src/main.tsx","side":"web","layer":"entry","group":"entry","lines":10,"blurb":"Mounts <App/>.","imports":["web/src/App.tsx"],"test":false},{"id":"web/src/mana.ts","side":"web","layer":"helpers","group":"helpers","lines":54,"blurb":"A mana cost you can read at a glance.  `{3}{W}{W}` printed literally is four pairs of braces and five symbols to decode, on every row of a list you are scanning rather than studying.","imports":["web/src/playtest.ts"],"test":true},{"id":"web/src/ownedBadge.ts","side":"web","layer":"helpers","group":"helpers","lines":65,"blurb":"The owned / available badge on a search result.","imports":["web/src/api.ts"],"test":true},{"id":"web/src/pickerColors.ts","side":"web","layer":"helpers","group":"helpers","lines":22,"blurb":"The colour filter for the deck picker.  The picker has two colour constraints that both have to hold: the commander's colour identity (a card outside it is illegal on arrival) and whatever the user clicked to narrow the ","imports":[],"test":true},{"id":"web/src/pickerTypes.ts","side":"web","layer":"helpers","group":"helpers","lines":62,"blurb":"The picker's card-type chips, as query text.","imports":[],"test":true},{"id":"web/src/playtest.ts","side":"web","layer":"helpers","group":"helpers","lines":307,"blurb":"Opening hands and goldfishing, for sanity-checking a curve and a mana base.","imports":["web/src/api.ts"],"test":true},{"id":"web/src/router.ts","side":"web","layer":"entry","group":"entry","lines":137,"blurb":"The URL as the app's top-level view, and back again.","imports":[],"test":true},{"id":"web/src/searchScope.ts","side":"web","layer":"helpers","group":"helpers","lines":67,"blurb":"The All / Owned / Available chips, as query text.","imports":[],"test":true},{"id":"web/src/substitutes.ts","side":"web","layer":"helpers","group":"helpers","lines":131,"blurb":"Accepting a substitute (Phase 27).  There is no swap endpoint, on purpose.","imports":["web/src/api.ts"],"test":true},{"id":"web/src/theme.ts","side":"web","layer":"entry","group":"entry","lines":52,"blurb":"Light / dark / follow-the-system.  Per device rather than per user, like the display density and the pane widths: it is a property of the screen you are sitting at.","imports":[],"test":false},{"id":"web/src/undo.ts","side":"web","layer":"helpers","group":"helpers","lines":124,"blurb":"A per-context undo/redo stack.  Each entry is a pair of thunks rather than a piece of state: everything this app edits is autosaved server-side, so going back a step means issuing the calls that reverse it, not restoring","imports":[],"test":false},{"id":"web/src/viewport.ts","side":"web","layer":"helpers","group":"helpers","lines":46,"blurb":"Whether the window is at or below a breakpoint, kept in step with resizes.","imports":[],"test":false},{"id":"web/src/styles.css","side":"web","layer":"entry","group":"entry","lines":3004,"blurb":"All CSS in one file. Sections are /* ---------- name ---------- */ headers; grep the feature name.","imports":[],"test":true},{"id":"schema.sql","side":"server","layer":"data","group":"schema","lines":1597,"blurb":"The complete SQLite schema, loaded verbatim on a fresh database. Every DDL change goes here and in migrations.ts.","imports":[],"test":true}],"tasks":[{"label":"How available / owned / reserved is computed","id":"server/src/decks/allocation.ts"},{"label":"How a deck's claim gets set","id":"server/src/decks/reconcile.ts"},{"label":"Buildable %, missing count, cost to complete","id":"server/src/decks/buildability.ts"},{"label":"Contention alert, reassign, what-if","id":"server/src/decks/contention.ts"},{"label":"Pull sheets and assembly runs","id":"server/src/decks/assembly.ts"},{"label":"Owned substitutes ranking","id":"server/src/decks/substitutes.ts"},{"label":"Deck CRUD and slot edits","id":"server/src/decks/store.ts"},{"label":"Format legality rules","id":"server/src/decks/validate.ts"},{"label":"Collection lots, locations, cost pools","id":"server/src/collection/store.ts"},{"label":"Want lists and fulfilment","id":"server/src/collection/wants.ts"},{"label":"Trade completion (cards in/out)","id":"server/src/trades/store.ts"},{"label":"Scryfall search syntax \u2192 SQL","id":"server/src/search/query.ts"},{"label":"owned: / available: / loc: predicates","id":"server/src/search/collection.ts"},{"label":"Bulk sync from Scryfall","id":"server/src/sync/runSync.ts"},{"label":"Add or change a setting","id":"server/src/routes/settings.ts"},{"label":"Which errors become which status","id":"server/src/routes/errorHandler.ts"},{"label":"Any DDL change (with schema.sql)","id":"server/src/db/migrations.ts"},{"label":"The HTTP client and shared types","id":"web/src/api.ts"},{"label":"Top-level views and nav","id":"web/src/App.tsx"},{"label":"URL \u2194 view mapping","id":"web/src/router.ts"},{"label":"Deck builder page (data, panels, undo)","id":"web/src/components/DeckBuilder.tsx"},{"label":"Deck builder three-pane layout and picker","id":"web/src/components/DeckPanes.tsx"},{"label":"The 'Have it / Need N' slot chip","id":"web/src/deckSlot.ts"},{"label":"Decks index page","id":"web/src/components/DeckList.tsx"},{"label":"Collection page and its tabs","id":"web/src/components/CollectionPage.tsx"},{"label":"Grouping / sorting card lists","id":"web/src/deckView.ts"},{"label":"Display density","id":"web/src/density.ts"},{"label":"Undo / redo","id":"web/src/undo.ts"},{"label":"All styling","id":"web/src/styles.css"}]};
const LAYERS = {
  server: [
    ['entry',    'Entry',    'index.ts builds every store and registers every route file'],
    ['routes',   'Routes',   'validate, call one store, map an error class to a status — no rules here'],
    ['stores',   'Stores',   'every read and write of user data; each mutation ends by reconciling'],
    ['engines',  'Engines',  'the figures: available → claim → coverage → contention'],
    ['pure',     'Pure rules','no database, no I/O — tested with plain node --test'],
    ['services', 'Services', 'reach outside: Scryfall sync, image cache, import/export/backup'],
    ['data',     'Data',     'schema.sql is the source of truth; migrations.ts carries upgrades'],
  ],
  web: [
    ['entry',      'Entry',        'App.tsx switches views by router.ts; styles.css is the only stylesheet'],
    ['pages',      'Pages',        'one per top-level view'],
    ['deckbuilder','Deck builder', 'DeckBuilder orchestrates; DeckPanes lays out; the rest are panels and dialogs'],
    ['shared',     'Shared components', 'used by more than one page'],
    ['helpers',    'Presentation helpers', 'pure .ts — they choose words for server figures and derive none'],
    ['data',       'API client',   'the only file that calls fetch(); every shared type lives here'],
  ],
};
const HUBS = new Set(['server/src/decks/allocation.ts', 'web/src/api.ts']);
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const importers = {};
for (const n of DATA.nodes) for (const t of n.imports) (importers[t] ||= []).push(n.id);

const short = id => id.replace(/^server\/src\//, '').replace(/^web\/src\//, '').replace(/^components\//, '');
let side = 'server', selected = null;

const bandsEl = document.getElementById('bands');
const mapEl = document.getElementById('map');
const svg = document.getElementById('edges');
const detail = document.getElementById('detail');

function render() {
  bandsEl.innerHTML = '';
  const layers = LAYERS[side];
  layers.forEach(([key, title, note], i) => {
    const nodes = DATA.nodes.filter(n => n.side === (key === 'data' && side === 'server' ? n.side : side) && n.layer === key && (side === 'server' ? n.side === 'server' || n.id === 'schema.sql' : n.side === 'web'));
    if (!nodes.length) return;
    const band = document.createElement('section');
    band.className = 'band';
    band.innerHTML = `<div class="band-head"><h2>${title}</h2><span class="note">${note}</span></div>`;
    const groups = {};
    for (const n of nodes) (groups[n.group] ||= []).push(n);
    const gwrap = document.createElement('div'); gwrap.className = 'groups';
    for (const [g, ns] of Object.entries(groups)) {
      const gel = document.createElement('div'); gel.className = 'group';
      if (Object.keys(groups).length > 1 || g !== key) gel.innerHTML = `<div class="group-label">${g}/</div>`;
      const chips = document.createElement('div'); chips.className = 'chips';
      for (const n of ns.sort((a, b) => short(a.id).localeCompare(short(b.id)))) {
        const b = document.createElement('button');
        b.className = 'chip' + (HUBS.has(n.id) ? ' hub' : '');
        b.dataset.id = n.id; b.textContent = short(n.id).replace(/^[a-z]+\//, '');
        b.title = n.id;
        b.addEventListener('click', () => select(n.id === selected ? null : n.id));
        chips.appendChild(b);
      }
      gel.appendChild(chips); gwrap.appendChild(gel);
    }
    band.appendChild(gwrap);
    if (i < layers.length - 1) { const a = document.createElement('div'); a.className = 'arrow'; band.appendChild(a); }
    bandsEl.appendChild(band);
  });
  applySelection();
}

function chipFor(id) { return bandsEl.querySelector(`.chip[data-id="${CSS.escape(id)}"]`); }

function select(id) {
  selected = id;
  if (id && byId[id].side !== side && id !== 'schema.sql') { setSide(byId[id].side); return; }
  applySelection();
  if (id) { const c = chipFor(id); c && c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function applySelection() {
  mapEl.classList.remove('searching');
  for (const c of bandsEl.querySelectorAll('.chip')) c.classList.remove('sel', 'imp', 'by', 'hit');
  svg.innerHTML = '';
  if (!selected || !byId[selected]) { mapEl.classList.remove('focused'); renderDetail(null); return; }
  const n = byId[selected];
  mapEl.classList.add('focused');
  chipFor(n.id)?.classList.add('sel');
  for (const t of n.imports) chipFor(t)?.classList.add('imp');
  for (const s of importers[n.id] || []) chipFor(s)?.classList.add('by');
  drawEdges(n);
  renderDetail(n);
}

function center(el) {
  const r = el.getBoundingClientRect(), m = mapEl.getBoundingClientRect();
  return { x: r.left - m.left + r.width / 2, y: r.top - m.top + r.height / 2, top: r.top - m.top, bottom: r.bottom - m.top };
}
function drawEdges(n) {
  const from = chipFor(n.id); if (!from) return;
  const a = center(from);
  const path = (b, color) => {
    const down = b.y > a.y;
    const y0 = down ? a.bottom : a.top, y1 = down ? b.top : b.bottom;
    const dy = (y1 - y0) / 2;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${a.x},${y0} C${a.x},${y0 + dy} ${b.x},${y1 - dy} ${b.x},${y1}`);
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', color); p.setAttribute('stroke-width', '1.5'); p.setAttribute('opacity', '0.75');
    svg.appendChild(p);
  };
  for (const t of n.imports) { const c = chipFor(t); if (c) path(center(c), 'var(--imports)'); }
  for (const s of importers[n.id] || []) { const c = chipFor(s); if (c) path(center(c), 'var(--importers)'); }
}

function renderDetail(n) {
  if (!n) {
    detail.innerHTML = `<div class="hint">
      <p><strong>Click a file</strong> to see what it does, what it imports (blue) and what imports it (green).</p>
      <p>The green list is the blast radius: change a signature and those files have to follow.</p>
      <p>Bands read top to bottom the way a request does — a route calls a store, a store calls an engine, every engine reads <kbd>allocation.ts</kbd>.</p>
      <p>Chips with an orange edge are the two hubs. Files with a <span class="stat">test</span> badge have a colocated <kbd>.test.ts</kbd>.</p>
    </div>`;
    return;
  }
  const list = (ids, cls, title) => {
    const arr = (ids || []).slice().sort();
    return `<h3 class="${cls}">${title} <span class="n">${arr.length}</span></h3>` +
      (arr.length ? `<ul>${arr.map(i => `<li><button class="link" data-go="${i}">${short(i)}</button></li>`).join('')}</ul>` : `<div class="empty">none</div>`);
  };
  const layerName = (LAYERS[n.side === 'web' ? 'web' : 'server'].find(l => l[0] === n.layer) || [])[1] || n.layer;
  detail.innerHTML = `
    <p class="path">${n.id}</p>
    <div class="meta"><span class="layer">${layerName}</span><span>${n.lines.toLocaleString()} lines</span>${n.test ? '<span class="stat">test</span>' : ''}${HUBS.has(n.id) ? '<span class="stat hub">hub</span>' : ''}</div>
    <p class="blurb">${n.blurb || ''}</p>
    ${list(n.imports, 'ti', 'Imports')}
    ${list(importers[n.id], 'to', 'Imported by')}
    <button class="clear" id="clear">Clear selection</button>`;
  detail.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => select(b.dataset.go)));
  document.getElementById('clear').addEventListener('click', () => select(null));
}

function setSide(s) {
  side = s;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.side === s)));
  render();
  if (selected) { const c = chipFor(selected); c && c.scrollIntoView({ block: 'nearest' }); }
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { if (selected && byId[selected]?.side !== b.dataset.side) selected = null; setSide(b.dataset.side); }));

const taskSel = document.getElementById('task');
for (const t of DATA.tasks) { const o = document.createElement('option'); o.value = t.id; o.textContent = `${t.label} → ${short(t.id)}`; taskSel.appendChild(o); }
taskSel.addEventListener('change', () => { if (taskSel.value) select(taskSel.value); });

const q = document.getElementById('q');
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  if (!v) { applySelection(); return; }
  selected = null; svg.innerHTML = ''; mapEl.classList.remove('focused'); mapEl.classList.add('searching'); renderDetail(null);
  let first = null;
  for (const c of bandsEl.querySelectorAll('.chip')) {
    const hit = c.dataset.id.toLowerCase().includes(v);
    c.classList.toggle('hit', hit); if (hit && !first) first = c;
  }
});
q.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = bandsEl.querySelector('.chip.hit'); if (f) { q.value = ''; select(f.dataset.id); } } });

let raf = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { svg.innerHTML = ''; if (selected) drawEdges(byId[selected]); }); });
document.fonts?.ready.then(() => { if (selected) { svg.innerHTML = ''; drawEdges(byId[selected]); } });

render();
select('server/src/decks/allocation.ts');
</script>
