# MTG Library — https://github.com/daveSoupy/MTG-Card-Library
#
# This file is all you need. Put it in a folder, open a terminal there, and run:
#
#     docker compose up -d
#
# then open http://localhost:8080 in your browser.

services:
  mtg-library:
    # Built and published by GitHub Actions for both Intel/AMD and ARM
    # (Apple Silicon, Raspberry Pi). To build it yourself instead, run
    #   docker build -t ghcr.io/davesoupy/mtg-card-library:latest .
    # from a checkout and the local image is used until you next `pull`.
    image: ghcr.io/davesoupy/mtg-card-library:latest
    container_name: mtg-library
    restart: unless-stopped
    ports:
      # host:container — change the left side if 8080 is taken on your machine.
      - "8080:8080"
    volumes:
      # Everything worth keeping (your collection, decks, trades, backups) is
      # in this volume. Card data and images re-download from Scryfall.
      - mtg-data:/data
    # Prefer a folder you can see? Comment out the two volume lines above and
    # below, and use this instead. On Linux the folder must be writable by
    # uid 1000:   mkdir -p ./data && sudo chown 1000:1000 ./data
    # volumes:
    #   - ./data:/data
    environment:
      MTG_LOG_LEVEL: info
      # Announce the server on the home network over mDNS so a phone paired by
      # QR finds it after its address changes. Multicast does not leave the
      # default bridge network: this only works together with host networking
      # on a Linux host (uncomment both lines below — `ports:` above is then
      # ignored and the server listens on the host's own 8080; Docker Desktop
      # on a Mac or PC keeps multicast inside its VM either way). Without it
      # the QR still works, by address: open the Data page at this computer's
      # own network address (http://192.168.x.x:8080/data, not localhost) and
      # the code carries that address, which a phone on the wifi can reach.
      # MTG_ADVERTISE: "1"
    # network_mode: host

volumes:
  mtg-data:
